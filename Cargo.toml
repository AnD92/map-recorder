[package]
name = "map-recorder"
version = "0.1.0"
edition = "2024"
description = "Record everything your Mac plays, then trim the silence around it"
license = "MIT"
repository = "https://github.com/AnD92/map-recorder"
readme = "README.md"
keywords = ["audio", "recording", "macos", "coreaudio", "cli"]
categories = ["command-line-utilities", "multimedia::audio"]

[dependencies]
anyhow = "1.0.105"
block2 = "0.6.2"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.10", features = ["derive"] }
clap_complete = "4.6.12"
ctrlc = { version = "3.5.3", features = ["termination"] }
hound = "3.5.1"
objc2 = "0.6.5"
objc2-core-audio = "0.3.2"
objc2-core-audio-types = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-foundation = "0.3.2"
rtrb = "0.4.1"
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"
